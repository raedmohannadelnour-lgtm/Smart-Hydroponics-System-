<!DOCTYPE html>
<!--
  =====================================================================================
  Lamba Smart Hydroponics: admin account setup (admin-setup.html)
  =====================================================================================
  A form only; it stores nothing itself. It sends the setup key and account details to
  the Worker (POST /auth/setup), which hashes the password and saves it in D1.
  Protected by the Worker secret SETUP_KEY: without it nothing can be created.

  Create / update: username + display name + password (8+ chars). Updating an existing
    username resets its password and signs that admin out everywhere.
  Delete: username + the Delete button.

  SETTING TO CHANGE: API_BASE (Cloudflare Worker URL, no trailing slash).
  Must be uploaded together with index.html (every upload replaces the whole site).
  =====================================================================================
-->

<div class="card">
  <h1>Admin account setup</h1>
  <p class="note">Creates an admin account, or resets the password of an existing one (which also signs
    it out everywhere). You need the <b>SETUP_KEY</b> secret you set on the Worker.
    Without the setup key, nobody can create an account.</p>

  <label>Setup key</label>
  <input id="setupKey" type="password" autocomplete="off">
  <label>Username (used to log in)</label>
  <input id="username" autocapitalize="none" autocomplete="off" placeholder="e.g. admin">
  <label>Display name (shown in the activity log)</label>
  <input id="displayName" placeholder="e.g. Admin">
  <label>Password (8+ characters)</label>
  <input id="password" type="password" autocomplete="new-password">
  <label>Confirm password</label>
  <input id="password2" type="password" autocomplete="new-password">

  <div class="row">
    <button onclick="save()">Create / update account</button>
    <button class="danger" onclick="del()">Delete</button>
  </div>
  <div id="result"></div>
</div>
<a class="back" href="index.html">← Back to dashboard</a>
<script>
const API_BASE = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";
const $ = id => document.getElementById(id);
function show(msg, ok) { $('result').textContent = msg; $('result').className = ok ? 'ok' : 'err'; }
async function post(body) {
  try {
    const r = await fetch(API_BASE + '/auth/setup', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    r.ok ? show(data.message || 'Done', true) : show(data.error || ('Error ' + r.status), false);
    return r.ok;
  } catch (e) { show('Could not reach the Worker. Check your connection.', false); return false; }
}
async function save() {
  if ($('password').value !== $('password2').value) return show('Passwords do not match', false);
  const ok = await post({ setupKey: $('setupKey').value, username: $('username').value,
    displayName: $('displayName').value, password: $('password').value });
  if (ok) { $('password').value = ''; $('password2').value = ''; }
}
async function del() {
  const u = $('username').value.trim();
  if (!u) return show('Enter the username to delete', false);
  if (!confirm('Delete admin account "' + u + '"?')) return;
  post({ setupKey: $('setupKey').value, username: u, delete: true });
}
</script>
</body>
</html>
